name: PR Review Labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply review labels
    runs-on: ubuntu-latest
    steps:
      - name: Label PR for review
        uses: actions/github-script@v8
        with:
          script: |
            const managedLabels = {
              "kind/plugin": { color: "5319e7", description: "Changes plugin registry entries" },
              "kind/theme": { color: "0e8a16", description: "Changes theme registry entries" },
              "kind/mixed": { color: "1d76db", description: "Changes plugin and theme registry entries" },
              "kind/infra": { color: "cfd3d7", description: "Changes registry infrastructure only" },
              "review/needs-ci": { color: "fbca04", description: "Registry validation has not completed for the latest PR update" },
              "review/ci-passed": { color: "0e8a16", description: "Registry validation passed for the latest PR update" },
              "review/ci-failed": { color: "b60205", description: "Registry validation failed for the latest PR update" },
              "review/ownership": { color: "d93f0b", description: "Author ownership of a submitted repository needs manual review" },
            }
            const kindLabels = ["kind/plugin", "kind/theme", "kind/mixed", "kind/infra"]
            const statusLabels = ["review/needs-ci", "review/ci-passed", "review/ci-failed"]
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number

            function isPermissionError(error) {
              return error.status === 403
            }

            function warnSkipped(action, error) {
              core.warning(`${action} skipped: ${error.message}`)
            }

            async function ensureLabel(name) {
              const label = managedLabels[name]
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Reading label ${name}`, error)
                  return
                }
                if (error.status !== 404) throw error
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: label.color,
                    description: label.description,
                  })
                } catch (createError) {
                  if (isPermissionError(createError)) {
                    warnSkipped(`Creating label ${name}`, createError)
                    return
                  }
                  throw createError
                }
              }
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Removing label ${name}`, error)
                  return
                }
                if (error.status !== 404) throw error
              }
            }

            async function addLabels(labels) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels,
                })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Adding labels ${labels.join(", ")}`, error)
                  return
                }
                throw error
              }
            }

            for (const name of Object.keys(managedLabels)) await ensureLabel(name)

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            })
            const fileNames = files.map((file) => file.filename)
            const touchesPlugins = fileNames.includes("plugins.json")
            const touchesThemes = fileNames.includes("themes.json")
            const kindLabel = touchesPlugins && touchesThemes
              ? "kind/mixed"
              : touchesPlugins
                ? "kind/plugin"
                : touchesThemes
                  ? "kind/theme"
                  : "kind/infra"

            for (const name of kindLabels.filter((label) => label !== kindLabel)) await removeLabel(name)
            for (const name of statusLabels.filter((label) => label !== "review/needs-ci")) await removeLabel(name)
            await addLabels([kindLabel, "review/needs-ci"])

            async function readIndex(fileName, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: fileName, ref })
                const parsed = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"))
                return Array.isArray(parsed) ? parsed : []
              } catch {
                return []
              }
            }

            async function ownsRepository(login, repository) {
              const repoOwner = String(repository).split("/")[0] ?? ""
              if (repoOwner.toLowerCase() === login.toLowerCase()) return true
              try {
                await github.rest.orgs.checkPublicMembershipForUser({ org: repoOwner, username: login })
                return true
              } catch {
                return false
              }
            }

            const login = context.payload.pull_request.user.login
            const unverified = []
            for (const fileName of ["plugins.json", "themes.json"].filter((name) => fileNames.includes(name))) {
              const base = new Map((await readIndex(fileName, context.payload.pull_request.base.sha)).map((entry) => [entry.id, entry]))
              const head = await readIndex(fileName, `refs/pull/${pull_number}/head`)
              for (const entry of head) {
                const previous = base.get(entry.id)
                if (previous && previous.repo === entry.repo) continue
                if (!(await ownsRepository(login, entry.repo))) unverified.push(`${entry.id} (${entry.repo})`)
              }
            }

            if (unverified.length > 0) {
              await ensureLabel("review/ownership")
              await addLabels(["review/ownership"])
              core.warning(`@${login} is not the owner or a public org member of: ${unverified.join(", ")}`)
            } else {
              await removeLabel("review/ownership")
            }
