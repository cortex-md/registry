name: CI Result Labels

on:
  workflow_run:
    workflows:
      - Registry Review
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label validation result
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update review status labels
        uses: actions/github-script@v8
        with:
          script: |
            const managedLabels = {
              "review/needs-ci": { color: "fbca04", description: "Registry validation has not completed for the latest PR update" },
              "review/ci-passed": { color: "0e8a16", description: "Registry validation passed for the latest PR update" },
              "review/ci-failed": { color: "b60205", description: "Registry validation failed for the latest PR update" },
            }
            const { owner, repo } = context.repo
            const run = context.payload.workflow_run
            const statusLabel =
              run.conclusion === "success" ? "review/ci-passed" : "review/ci-failed"
            const labelsToRemove = Object.keys(managedLabels).filter((label) => label !== statusLabel)

            function isPermissionError(error) {
              return error.status === 403
            }

            function warnSkipped(action, error) {
              core.warning(`${action} skipped: ${error.message}`)
            }

            async function ensureLabel(name) {
              const label = managedLabels[name]
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Reading label ${name}`, error)
                  return
                }
                if (error.status !== 404) throw error
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color: label.color,
                    description: label.description,
                  })
                } catch (createError) {
                  if (isPermissionError(createError)) {
                    warnSkipped(`Creating label ${name}`, createError)
                    return
                  }
                  throw createError
                }
              }
            }

            async function removeLabel(issue_number, name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Removing label ${name}`, error)
                  return
                }
                if (error.status !== 404) throw error
              }
            }

            async function addLabels(issue_number, labels) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels,
                })
              } catch (error) {
                if (isPermissionError(error)) {
                  warnSkipped(`Adding labels ${labels.join(", ")}`, error)
                  return
                }
                throw error
              }
            }

            async function findPullRequestNumbers() {
              const direct = (run.pull_requests ?? []).map((pullRequest) => pullRequest.number)
              if (direct.length > 0) return direct
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 })
              return open.filter((pullRequest) => pullRequest.head.sha === run.head_sha).map((pullRequest) => pullRequest.number)
            }

            const pullRequestNumbers = await findPullRequestNumbers()
            if (pullRequestNumbers.length === 0) {
              core.info(`No open pull request has head ${run.head_sha}`)
              return
            }

            for (const name of Object.keys(managedLabels)) await ensureLabel(name)

            for (const issue_number of pullRequestNumbers) {
              for (const name of labelsToRemove) await removeLabel(issue_number, name)
              await addLabels(issue_number, [statusLabel])
            }
